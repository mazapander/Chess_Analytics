services:
  postgres:
    image: postgres:17-alpine
    container_name: chess_analytics_postgres
    environment:
      POSTGRES_DB: chess_analytics
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - chess_analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion_api/Dockerfile
    container_name: chess_analytics_ingestion_api
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics-api:
    build:
      context: .
      dockerfile: services/analytics_api/Dockerfile
    container_name: chess_analytics_analytics_api
    env_file:
      - .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stockfish-worker:
    build:
      context: .
      dockerfile: services/stockfish_worker/Dockerfile
    container_name: chess_analytics_stockfish_worker
    env_file:
      - .env
    environment:
      STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-14}
      STOCKFISH_POLL_SECONDS: ${STOCKFISH_POLL_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: chess_analytics_frontend
    environment:
      VITE_ANALYTICS_API_URL: http://localhost:8002
    ports:
      - "5173:5173"
    depends_on:
      - analytics-api
    restart: unless-stopped

volumes:
  chess_analytics_postgres_data:
