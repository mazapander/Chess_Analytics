services:
  postgres:
    image: postgres:17-alpine
    container_name: chess_analytics_postgres
    environment:
      POSTGRES_DB: chess_analytics
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - chess_analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: chess_analytics_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chess_analytics_postgres_data:
